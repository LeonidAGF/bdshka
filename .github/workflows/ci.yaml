name: Java CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn -B test

      - name: Checkstyle
        run: mvn -B checkstyle:check

      - name: PMD
        run: mvn -B pmd:check

      - name: SpotBugs
        run: mvn -B spotbugs:check

      - name: Build
        run: mvn -B verify